<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Whiskers & Homes</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <nav class="navbar">

        <div class="logo">
            🐾 Whiskers & Homes
        </div>

        <div class="nav-links">
            <a href="index.html">Website</a>
        </div>

    </nav>

</header>


<main>

    <section class="admin-login-section">

        <div class="admin-login-box">

            <div class="admin-login-icon">
                🔐
            </div>

            <p class="small-title">
                ADMIN AREA
            </p>

            <h1>
                Welcome Back
            </h1>

            <p class="admin-login-description">
                Please log in to view adoption applications.
            </p>


            <form id="admin-login-form">

                <label for="admin-email">
                    Email
                </label>

                <input
                    type="email"
                    id="admin-email"
                    placeholder="Admin email"
                    required
                >


                <label for="admin-password">
                    Password
                </label>

                <input
                    type="password"
                    id="admin-password"
                    placeholder="Password"
                    required
                >


                <button
                    type="submit"
                    class="submit-button"
                >
                    🔐 Login
                </button>


                <p
                    id="login-message"
                    class="form-message"
                ></p>

            </form>

        </div>

    </section>

</main>


<footer>

    <div class="footer-logo">
        🐾 Whiskers & Homes
    </div>

    <p>
        Admin Area
    </p>

</footer>


<script type="module" src="admin-login.js"></script>

</body>

</html>
